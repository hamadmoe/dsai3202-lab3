$schema: https://azuremlschemas.azureedge.net/latest/commandComponent.schema.json

name: split_dataset
display_name: Split Dataset
type: command

inputs:
  data:
    type: uri_folder

outputs:
  train:
    type: uri_folder
  val:
    type: uri_folder
  test:
    type: uri_folder
  deployment:
    type: uri_folder   # 🔥 THIS LINE WAS MISSING OR WRONG

code: .

command: >
  python split.py
  --data ${{inputs.data}}
  --train_out ${{outputs.train}}
  --val_out ${{outputs.val}}
  --test_out ${{outputs.test}}
  --deployment_out ${{outputs.deployment}}

environment: azureml:AzureML-sklearn-1.1-ubuntu20.04-py38-cpu@latest