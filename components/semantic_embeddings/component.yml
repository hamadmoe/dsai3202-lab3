$schema: https://azuremlschemas.azureedge.net/latest/commandComponent.schema.json

name: semantic_embeddings
display_name: Semantic Embedding Features
type: command

inputs:
  data:
    type: uri_folder

outputs:
  out:
    type: uri_folder

code: .

command: >
  python embeddings.py
  --data ${{inputs.data}}
  --out ${{outputs.out}}

environment: azureml:sbert-env@latest